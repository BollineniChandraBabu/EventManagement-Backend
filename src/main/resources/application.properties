spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.connection.handling_mode=DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION

# ---- Connection pool optimization ----
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.leak-detection-threshold=20000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

brevo.sender.email=${MAIL_USERNAME}
brevo.api.key=${BREVO_API_KEY}
brevo.sender.name=${BREVO_SENDER_NAME}
brevo.api.url=${BREVO_API_URL}

logging.level.com.familywishes=INFO

app.jwt.secret=${JWT_SECRET}
app.gemini.api.key=${GEMINI_API_KEY}
app.gemini.api.url = ${GEMINI_API_URL}
app.pollinations.image.url=${POLLINATIONS_IMAGE_URL:https://gen.pollinations.ai/image/}
app.pollinations.image.key=${POLLINATIONS_IMAGE_KEY:}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

scheduler.time-zone=Asia/Kolkata

alert.failure.threshold=5
alert.email.to=${MAIL_USERNAME}
management.endpoints.web.exposure.include=*

# Instagram Graph API
instagram.graph-url=https://graph.facebook.com/v18.0
instagram.page-access-token=YOUR_PAGE_ACCESS_TOKEN

# Async thread pool
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100

spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=always
spring.quartz.properties.org.quartz.scheduler.instanceName=GoldenGreetingsScheduler
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.jobStore.class=org.springframework.scheduling.quartz.LocalDataSourceJobStore
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
spring.quartz.properties.org.quartz.jobStore.useProperties=false
spring.quartz.properties.org.quartz.jobStore.tablePrefix=QRTZ_
spring.quartz.properties.org.quartz.jobStore.isClustered=true
spring.quartz.properties.org.quartz.threadPool.threadCount=5

gmail.client-id=${GMAIL_CLIENT_ID}
gmail.client-secret=${GMAIL_CLIENT_SECRET}
gmail.refresh-token=${GMAIL_REFRESH_TOKEN}
gmail.from-email=${GMAIL_FROM_EMAIL}
gmail.redirect-uri=https://eventmanagement-backend-ka9x.onrender.com/oauth2callback

instagram.verify.token=${INSTA_VERIFY_TOKEN}

calendarific.api.url=${CALENDARIFIC_API_URL:https://calendarific.com/api/v2/holidays}
calendarific.api.key=${CALENDARIFIC_API_KEY:}
calendarific.country=${CALENDARIFIC_COUNTRY:IN}

app.password-reset.ui-url=${PASSWORD_RESET_UI_URL:http://localhost:4200/reset-password}
app.password-reset.ttl-minutes=${PASSWORD_RESET_TTL_MINUTES:30}
app.pollinations.image.model=${POLLINATIONS_IMAGE_MODEL:imagen-4}
app.pollinations.balance.url=${POLLINATIONS_BALANCE_URL:https://gen.pollinations.ai/account/balance}

app.login.failed-attempt-threshold=${APP_LOGIN_FAILED_ATTEMPT_THRESHOLD:5}
app.google.sso.client-id=${GOOGLE_SSO_CLIENT_ID:${GMAIL_CLIENT_ID:}}
app.default-profile-picture.male-path=${DEFAULT_PROFILE_PICTURE_MALE_PATH:Profile Pictures/default/male.png}
app.default-profile-picture.female-path=${DEFAULT_PROFILE_PICTURE_FEMALE_PATH:Profile Pictures/default/female.png}
app.default-profile-picture.other-path=${DEFAULT_PROFILE_PICTURE_OTHER_PATH:Profile Pictures/default/male.png}

app.supabase.storage.endpoint=${SUPABASE_STORAGE_ENDPOINT:https://mzidaubueqnwdfzmktoq.storage.supabase.co/storage/v1/s3}
app.supabase.storage.region=${SUPABASE_STORAGE_REGION:ap-southeast-1}
app.supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:golden-greetings}
app.supabase.storage.access-key-id=${SUPABASE_STORAGE_ACCESS_KEY_ID}
app.supabase.storage.secret-access-key=${SUPABASE_STORAGE_SECRET_ACCESS_KEY}
app.supabase.storage.public-base-url=${SUPABASE_STORAGE_PUBLIC_BASE_URL:}


app.supabase.db.jdbc-url=${SUPABASE_DB_URL}
app.supabase.db.username=${SUPABASE_DB_USERNAME}
app.supabase.db.password=${SUPABASE_DB_PASSWORD}
app.supabase.db.driver-class-name=org.postgresql.Driver
app.supabase.db.maximum-pool-size=${SUPABASE_DB_POOL_SIZE:10}
app.supabase.db.minimum-idle=5
app.chat.unread-mail.cron=${APP_CHAT_UNREAD_MAIL_CRON:0 0 2 * * ?}
