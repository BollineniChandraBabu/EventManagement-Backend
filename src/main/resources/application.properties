spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.quartz.job-store-type=memory

logging.level.com.familywishes=INFO

app.jwt.secret=${JWT_SECRET}
app.gemini.api.key=${GEMINI_API_KEY}
app.gemini.api.url = ${GEMINI_API_URL}
app.huggingface.image.url = ${HUGGINGFACE_IMAGE_URL}
app.huggingface.image.key=${HUGGINGFACE_IMAGE_KEY}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

scheduler.time-zone=Asia/Kolkata

alert.failure.threshold=5
alert.email.to=${MAIL_USERNAME}
management.endpoints.web.exposure.include=*

# Instagram Graph API
instagram.graph-url=https://graph.facebook.com/v18.0
instagram.page-access-token=YOUR_PAGE_ACCESS_TOKEN

# Async thread pool
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100